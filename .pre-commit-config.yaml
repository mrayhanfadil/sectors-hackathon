# .pre-commit-config.yaml - Pre-commit hooks for institutional report pipeline
# Run order: lint -> format -> tests -> harness. Stop on first fail.
fail_fast: true

repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: 1. ruff check (lint, auto-fix)
        entry: .venv/bin/ruff check --fix
        language: system
        types: [python]
        exclude: ^(scripts/report_charts\.py|scripts/report_fixtures\.py|agents/valuation/gates\.py|agents/valuation/assumptions\.py|server/routers/.*)$

      - id: ruff-format
        name: 2. ruff format (formatter)
        entry: .venv/bin/ruff format
        language: system
        types: [python]
        exclude: ^(scripts/report_charts\.py|scripts/report_fixtures\.py|agents/valuation/gates\.py|agents/valuation/assumptions\.py|server/routers/.*)$

      - id: no-em-dash
        name: 3. typography + regex guards (no em dash in a shipped surface, rule §12)
        entry: .venv/bin/pytest tests/test_no_em_dash.py tests/test_regex_literals_compile.py -q
        language: system
        pass_filenames: false
        always_run: true

      - id: pytest-subset
        name: 4. pytest valuation + quintet (fast subset)
        entry: .venv/bin/pytest agents/valuation/ scripts/test_audit_quintet.py
        language: system
        pass_filenames: false
        always_run: true

      - id: harness-post-agy
        name: 5. post-agy recovery harness
        entry: .venv/bin/python scripts/harness_post_agy.py
        language: system
        pass_filenames: false
        always_run: true
