# .pre-commit-config.yaml — Pre-commit hooks for institutional report pipeline
# Run order: lint -> format -> tests -> harness -> typst. Stop on first fail.
fail_fast: true

repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: 1. ruff check (lint, auto-fix)
        entry: .venv/bin/ruff check --fix
        language: system
        types: [python]
        exclude: ^(scripts/report_charts\.py|scripts/report_fixtures\.py|agents/valuation/gates\.py|agents/valuation/assumptions\.py|server/routers/.*)$

      - id: ruff-format
        name: 2. ruff format (formatter)
        entry: .venv/bin/ruff format
        language: system
        types: [python]
        exclude: ^(scripts/report_charts\.py|scripts/report_fixtures\.py|agents/valuation/gates\.py|agents/valuation/assumptions\.py|server/routers/.*)$

      - id: pytest-subset
        name: 3. pytest valuation + quintet (fast subset)
        entry: .venv/bin/pytest agents/valuation/ scripts/test_audit_quintet.py
        language: system
        pass_filenames: false
        always_run: true

      - id: harness-post-agy
        name: 4. post-agy recovery harness
        entry: .venv/bin/python scripts/harness_post_agy.py
        language: system
        pass_filenames: false
        always_run: true

      - id: typst-compile-archetypes
        name: 5. typst compile-check 4 archetypes
        entry: bash -c 'for arch in single sotp infra strategy; do typst compile --font-path assets/fonts --root / templates/typst/archetypes/report_${arch}.typ /tmp/typst_precommit_${arch}.pdf || exit 1; rm -f /tmp/typst_precommit_${arch}.pdf; done'
        language: system
        pass_filenames: false
        always_run: true
