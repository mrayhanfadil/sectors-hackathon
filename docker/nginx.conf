# nginx in front of the built SPA: same origin for the page and the API, which is what removes CORS from the picture.

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # The PDF endpoint renders eleven pages through Chromium; the default 60s proxy timeout is not enough.
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml font/woff2;

    # Vite fingerprints every asset, so a changed file is a changed URL: cache hard.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # The shell must never be cached, or a deploy leaves users on an old bundle that points at new asset hashes.
    location = /index.html {
        add_header Cache-Control "no-store";
    }

    # API: proxied to the api service on the compose network. No fastcgi, no rewriting of the path.
    location /api/ {
        proxy_pass http://api:8777;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Server-sent events (the agent run trace) must not be buffered.
        proxy_buffering off;
        proxy_cache off;
    }

    # SPA fallback: every unknown path is a client route, not a 404.
    location / {
        try_files $uri /index.html;
    }
}
